<tr>
    <td style="padding:8px;border-bottom:1px solid #eee;">
        <a href="{url}" style="color:#667eea;text-decoration:none;font-weight:500;">{title}</a>
    </td>
    <td style="padding:8px;border-bottom:1px solid #eee;text-align:center;">
        <span style="background:{color};color:white;padding:2px 8px;border-radius:4px;font-size:12px;">{remark}</span>
    </td>
    <td style="padding:8px;border-bottom:1px solid #eee;text-align:center;font-size:14px;">{score}</td>
</tr>
