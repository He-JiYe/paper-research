# Paper Research 配置示例
# 复制为 config/config.yaml 后填写自己的值。
# 安全建议：所有密钥均支持 ${ENV_VAR} 占位符，优先使用环境变量，避免明文写入本文件。
#   Windows PowerShell 设置环境变量（持久化，需新开终端生效）：
#     setx DEEPSEEK_API_KEY "sk-xxxx"
#     setx ZOTERO_API_KEY "xxxx"
#     setx ZOTERO_LIBRARY_ID "12345678"
#     setx EMAIL_PASSWORD "smtp-auth-code"

llm:
  # provider: deepseek | ollama
  #   - deepseek：OpenAI 兼容接口（api_key 必填，api_base 指 https://api.deepseek.com 或任意兼容端点）
  #   - ollama：本地模型原生接口（POST {api_base}/api/chat，无需 api_key，api_base 默认 http://localhost:11434）
  provider: deepseek
  model: deepseek-v4-flash        # 如使用其他模型请确认 API 侧模型名有效
  api_key: ${DEEPSEEK_API_KEY}
  api_base: https://api.deepseek.com
  temperature: 0.3
  max_tokens: 2000

fetch:
  # 多数据源：每个 source 提供对应 FetchOptions 的参数（registry 按 source 名解析）
  sources:
    - source: arxiv
      max_results: 20
      lookback_days: 3
      # relevance | submittedDate | lastUpdatedDate（仅决定排序顺序）；
      # 增量（lookback_days>0）统一追加查询内 submittedDate 窗口（服务端过滤），
      # 历史（lookback_days=0）不加日期约束、直接取 max_results；推荐 relevance + lookback
      sort_by: relevance

# 关键词：全源共享，固定形式 keyword/categories/active（无每词个性化）
keywords:
  - keyword: test-time adaptation
    categories: [cs.CV, cs.LG]
    active: true
  - keyword: large language model
    categories: [cs.CL]
    active: true

notification:
  email:
    enabled: false
    smtp_host: smtp.qq.com
    smtp_port: 465
    username: your-email@qq.com
    password: ${EMAIL_PASSWORD}
    from_addr: your-email@qq.com
    to_addr: your-email@qq.com

scheduler:
  enabled: true
  fetch_time: "08:30"
  catch_up_on_start: true          # serve 启动时若今天错过抓取则自动补抓

server:
  host: 127.0.0.1                  # 不要改为 0.0.0.0，除非你知道自己在做什么
  port: 8899

zotero:
  api_key: ${ZOTERO_API_KEY}
  library_id: ${ZOTERO_LIBRARY_ID}
  library_type: user
