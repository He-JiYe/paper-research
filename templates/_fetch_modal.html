<!-- 共享 Fetch 模态框（keyword fetch + search + keywords settings） -->
<div id="fetch-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h3 class="modal-title">🔄 Arxiv 论文操作</h3>
        <!-- Tabs -->
        <div class="modal-tabs">
            <button id="ftab-keyword" class="ftab active" onclick="switchFetchTab('keyword')">关键词抓取</button>
            <button id="ftab-search" class="ftab" onclick="switchFetchTab('search')">搜索论文</button>
            <button id="ftab-keywords" class="ftab" onclick="switchFetchTab('keywords')">关键词设置</button>
        </div>
        <!-- Tab: Keyword Fetch -->
        <div id="fpanel-keyword">
            <label class="form-label">关键词（留空则使用配置）</label>
            <input id="fetch-keyword" class="form-input" placeholder="如: test-time adaptation">
            <label class="form-label">Arxiv 分类（可选）</label>
            <div id="cat-checkboxes" class="cat-pills">
                <label><input type="checkbox" name="arxiv_cats" value="cs.AI"> cs.AI</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.CL"> cs.CL</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.CV"> cs.CV</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.LG"> cs.LG</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.NE"> cs.NE</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.IR"> cs.IR</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.SE"> cs.SE</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.PL"> cs.PL</label>
                <label><input type="checkbox" name="arxiv_cats" value="cs.CR"> cs.CR</label>
                <label><input type="checkbox" name="arxiv_cats" value="stat.ML"> stat.ML</label>
            </div>
            <label class="form-label">结果数量</label>
            <input id="fetch-max" type="number" value="{{ fetch_config.max_results }}" min="5" max="100" class="form-input">
            <label class="form-label">抓取模式</label>
            <div class="radio-row">
                <label>
                    <input type="radio" name="fetch-mode" value="incremental" checked onchange="toggleFetchModeHint()">
                    增量模式 — 最近 <span id="fetch-lb-days">{{ fetch_config.lookback_days }}</span> 天内的最新论文
                </label>
                <label>
                    <input type="radio" name="fetch-mode" value="historical" onchange="toggleFetchModeHint()">
                    历史模式 — 全量按相关性排序
                </label>
            </div>
            <div class="modal-actions">
                <button onclick="doFetch()" class="btn btn-primary btn-flex">开始抓取</button>
                <button onclick="closeFetchModal()" class="btn btn-ghost">关闭</button>
            </div>
            <div id="fetch-result" class="modal-status"></div>
        </div>
        <!-- Tab: Search -->
        <div id="fpanel-search" style="display:none;">
            <label class="form-label">搜索词（支持 ti: / au: / all: 前缀）</label>
            <div class="kw-input-row">
                <input id="search-query" class="form-input" placeholder='如: ti:transformer 或 all:out-of-distribution'>
                <button onclick="doSearch()" class="btn btn-primary">搜索</button>
            </div>
            <div id="search-results">
                <div class="search-empty">输入搜索词后点击搜索</div>
            </div>
            <div class="modal-actions">
                <button id="import-btn" onclick="doImport()" class="btn btn-success btn-flex" disabled>导入选中 (0 篇)</button>
                <button onclick="closeFetchModal()" class="btn btn-ghost">关闭</button>
            </div>
            <div id="import-status" class="modal-status"></div>
        </div>  <!-- close fpanel-search -->
        <!-- Tab: Keyword Settings -->
        <div id="fpanel-keywords" style="display:none;">
            <label class="form-label">关键词管理</label>
            <div id="kw-list" class="kw-list">
                <div class="search-empty">切换到该标签加载...</div>
            </div>
            <!-- 增量抓取设置 -->
            <div class="kw-settings-box">
                <div class="kw-input-row">
                    <div style="flex:1;">
                        <label class="form-label">每关键词目标新增数</label>
                        <input id="kw-target-new" type="number" min="5" max="200" value="{{ fetch_config.max_results }}" class="form-input">
                    </div>
                    <div style="flex:1;">
                        <label class="form-label">历史回溯天数</label>
                        <input id="kw-lookback-days" type="number" min="7" max="730" value="{{ fetch_config.lookback_days }}" class="form-input">
                    </div>
                </div>
                <label class="form-label">抓取模式</label>
                <div class="radio-row">
                    <label>
                        <input type="radio" name="config-fetch-mode" value="incremental" checked>
                        增量模式 — 最近 <span id="cfg-lb-days">{{ fetch_config.lookback_days }}</span> 天内
                    </label>
                    <label>
                        <input type="radio" name="config-fetch-mode" value="historical">
                        历史模式 — 全量按相关性排序
                    </label>
                </div>
            </div>
            <div class="kw-input-row">
                <input id="kw-new-keyword" class="form-input" style="flex:2;" placeholder="新关键词">
                <input id="kw-new-cat" class="form-input" style="flex:1;" placeholder="arxiv分类 如 cs.CV,cs.LG">
                <button onclick="addKeywordItem()" class="btn btn-primary">添加</button>
            </div>
            <div class="modal-actions">
                <button onclick="saveAllSettings()" class="btn btn-success btn-flex">保存设置</button>
                <button onclick="reloadConfig()" class="btn btn-warning">🔄 重载配置</button>
                <button onclick="fetchByConfig()" class="btn btn-primary btn-flex">按设置抓取</button>
                <button onclick="closeFetchModal()" class="btn btn-ghost">关闭</button>
            </div>
            <div id="kw-result" class="modal-status"></div>
        </div>  <!-- close fpanel-keywords -->
    </div>  <!-- close modal-card -->
</div>  <!-- close fetch-modal -->

<script>
/* ─── Tab 切换 ───────────────────────────── */
function switchFetchTab(tab) {
    document.querySelectorAll('.ftab').forEach(function(btn) { btn.classList.remove('active'); });
    var activeBtn = document.getElementById('ftab-' + tab);
    if (activeBtn) { activeBtn.classList.add('active'); }
    document.getElementById('fpanel-keyword').style.display = tab === 'keyword' ? '' : 'none';
    document.getElementById('fpanel-search').style.display = tab === 'search' ? '' : 'none';
    document.getElementById('fpanel-keywords').style.display = tab === 'keywords' ? '' : 'none';
    if (tab === 'keywords') { loadKeywords(); }
}

/* ─── 关键词抓取 Tab ─────────────────────── */
function toggleFetchModeHint() {
    var mode = document.querySelector('input[name="fetch-mode"]:checked');
    var lbSpan = document.getElementById('fetch-lb-days');
    var lbDays = lbSpan ? lbSpan.textContent : '{{ fetch_config.lookback_days }}';
    lbSpan.textContent = mode && mode.value === 'incremental' ? lbDays : '全量';
}

async function doFetch() {
    var btn = event ? event.target : arguments.callee;
    btn.disabled = true;
    btn.textContent = '抓取中...';
    var resultEl = document.getElementById('fetch-result');
    resultEl.textContent = '开始抓取...';
    try {
        var params = new URLSearchParams();
        var kw = document.getElementById('fetch-keyword').value.trim();
        if (kw) params.append('keyword', kw);
        params.append('max_results', document.getElementById('fetch-max').value || '{{ fetch_config.max_results }}');
        var mode = document.querySelector('input[name="fetch-mode"]:checked');
        params.append('mode', mode ? mode.value : 'incremental');
        var res = await fetch('/api/fetch', {method: 'POST', body: params});
        if (!res.ok) { resultEl.textContent = '请求失败'; btn.disabled = false; btn.textContent = '开始抓取'; return; }
        resultEl.textContent = '等待结果...';
        waitFetchResult(function(data) {
            resultEl.textContent = '抓取完成: 获取 ' + (data.fetched || 0) + ' 篇, 新增 ' + (data.new || 0) + ' 篇';
            btn.disabled = false;
            btn.textContent = '开始抓取';
        });
    } catch(e) {
        resultEl.textContent = '网络错误: ' + e.message;
        btn.disabled = false;
        btn.textContent = '开始抓取';
    }
}

/* ─── 搜索 Tab ───────────────────────────── */
let _searchQuery = '';

async function doSearch() {
    var query = document.getElementById('search-query').value.trim();
    if (!query) return;
    _searchQuery = query;
    var resultsEl = document.getElementById('search-results');
    resultsEl.innerHTML = '<div class="search-empty">搜索中...</div>';
    document.getElementById('import-btn').disabled = true;
    document.getElementById('import-btn').textContent = '导入选中 (0 篇)';
    try {
        var params = new URLSearchParams();
        params.append('query', query);
        params.append('max_results', document.getElementById('fetch-max').value || '{{ fetch_config.max_results }}');
        var res = await fetch('/api/search-preview', {method: 'POST', body: params});
        var data = await res.json();
        var papers = data.papers || [];
        if (!papers.length) {
            resultsEl.innerHTML = '<div class="search-empty">未找到结果</div>';
            return;
        }
        var html = '';
        papers.forEach(function(p, i) {
            var status = '';
            if (p._in_zotero) status = '<span class="status-ok">✓ 已在 Zotero</span>';
            else if (p._in_pending) status = '<span class="status-pending">⏳ 已在待审阅</span>';
            else status = '<span class="status-new">● 新</span>';
            html += '<div class="search-item" onclick="toggleSearchItem(this)">';
            html += '<div class="search-item-row">';
            html += '<input type="checkbox" class="search-check" value="' + p.arxiv_id + '" data-title="' + (p.title || '').replace(/"/g, '&quot;') + '">';
            html += '<div style="flex:1;">';
            html += '<div class="search-item-title"><a href="https://arxiv.org/abs/' + p.arxiv_id + '" target="_blank">[' + p.arxiv_id + '] ' + (p.title || '') + '</a></div>';
            html += '<div class="search-item-authors">' + (p.authors || '').substring(0, 120) + '</div>';
            html += '<div class="search-item-status">' + status + '</div>';
            html += '</div></div></div>';
        });
        resultsEl.innerHTML = html;
        document.getElementById('import-btn').disabled = false;
        updateImportCount();
    } catch(e) {
        resultsEl.innerHTML = '<div class="search-empty search-error">搜索失败: ' + e.message + '</div>';
    }
}

function toggleSearchItem(el) {
    var cb = el.querySelector('.search-check');
    if (cb) { cb.checked = !cb.checked; }
    updateImportCount();
}

function updateImportCount() {
    var checked = document.querySelectorAll('.search-check:checked').length;
    var btn = document.getElementById('import-btn');
    btn.textContent = '导入选中 (' + checked + ' 篇)';
    btn.disabled = checked === 0;
}

async function doImport() {
    var checked = document.querySelectorAll('.search-check:checked');
    if (!checked.length) return;
    var arxivIds = Array.from(checked).map(function(cb) { return cb.value; });
    var btn = document.getElementById('import-btn');
    btn.disabled = true;
    btn.textContent = '导入中...';
    var statusEl = document.getElementById('import-status');
    statusEl.textContent = '导入中...';
    try {
        var res = await fetch('/api/search-import', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({arxiv_ids: arxivIds})
        });
        var data = await res.json();
        statusEl.textContent = '导入完成: 新增 ' + (data.imported || 0) + ' 篇';
        btn.textContent = '导入选中 (0 篇)';
        doSearch(); // refresh search results
    } catch(e) {
        statusEl.textContent = '导入失败: ' + e.message;
        btn.disabled = false;
        btn.textContent = '导入选中 (' + checked.length + ' 篇)';
    }
}

/* ─── 关键词设置 Tab ─────────────────────── */
let _kwData = [];

async function loadKeywords() {
    var listEl = document.getElementById('kw-list');
    listEl.innerHTML = '<div class="search-empty">加载中...</div>';
    try {
        var res = await fetch('/api/keywords');
        if (!res.ok) { listEl.innerHTML = '<div class="search-empty search-error">加载失败</div>'; return; }
        var data = await res.json();
        _kwData = data.keywords || [];
        renderKeywords();
        // 同步 fetch 配置到输入框（支持运行时重载配置）
        _applyFetchConfig(data.fetch_config);
    } catch(e) {
        listEl.innerHTML = '<div class="search-empty search-error">网络错误</div>';
    }
}

/* 同步 fetch 配置到 UI（loadKeywords / reloadConfig 共用） */
function _applyFetchConfig(fc) {
    if (!fc) return;
    if (fc.max_results) {
        document.getElementById('kw-target-new').value = fc.max_results;
        document.getElementById('fetch-max').value = fc.max_results;
    }
    if (fc.lookback_days) {
        document.getElementById('kw-lookback-days').value = fc.lookback_days;
        document.getElementById('cfg-lb-days').textContent = fc.lookback_days;
        document.getElementById('fetch-lb-days').textContent = fc.lookback_days;
    }
}

function renderKeywords() {
    var listEl = document.getElementById('kw-list');
    if (!_kwData.length) {
        listEl.innerHTML = '<div class="search-empty">暂无关键词</div>';
        return;
    }
    var html = '';
    _kwData.forEach(function(kw, i) {
        var cats = (kw.arxiv_cats || []).join(', ');
        html += '<div class="kw-item">';
        html += '<div><span class="kw-item-keyword">' + kw.keyword + '</span>';
        if (cats) html += '<span class="kw-item-cats">' + cats + '</span>';
        html += '</div>';
        html += '<button onclick="removeKeyword(' + i + ')" class="kw-remove" title="删除">×</button>';
        html += '</div>';
    });
    listEl.innerHTML = html;
}

function addKeywordItem() {
    var kwInput = document.getElementById('kw-new-keyword');
    var catInput = document.getElementById('kw-new-cat');
    var keyword = kwInput.value.trim();
    if (!keyword) { document.getElementById('kw-result').textContent = '请输入关键词'; return; }
    var cats = catInput.value.trim();
    var entry = {keyword: keyword, active: true};
    if (cats) {
        entry.arxiv_cats = cats.split(',').map(function(c) { return c.trim(); }).filter(Boolean);
    }
    _kwData.push(entry);
    renderKeywords();
    kwInput.value = '';
    catInput.value = '';
    document.getElementById('kw-result').textContent = '已添加: ' + keyword;
}

function removeKeyword(index) {
    _kwData.splice(index, 1);
    renderKeywords();
}

async function saveAllSettings() {
    var resultEl = document.getElementById('kw-result');
    resultEl.textContent = '保存中...';
    try {
        var payload = {
            keywords: _kwData,
            fetch_config: {
                max_results: parseInt(document.getElementById('kw-target-new').value, 10),
                lookback_days: parseInt(document.getElementById('kw-lookback-days').value, 10)
            }
        };
        var res = await fetch('/api/keywords', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (!res.ok) { resultEl.textContent = '保存失败'; return; }
        var data = await res.json();
        resultEl.textContent = '✅ 配置已保存';
        // 保存后同步 UI，确保显示与服务端一致
        _applyFetchConfig(payload.fetch_config);
    } catch(e) {
        resultEl.textContent = '保存失败: ' + e.message;
    }
}

async function reloadConfig() {
    var resultEl = document.getElementById('kw-result');
    resultEl.textContent = '重载中...';
    try {
        var res = await fetch('/api/keywords');
        var data = await res.json();
        _kwData = data.keywords || [];
        renderKeywords();
        _applyFetchConfig(data.fetch_config);
        resultEl.textContent = '✅ 配置已重载 (' + _kwData.length + ' 个关键词)';
    } catch(e) {
        resultEl.textContent = '重载失败: ' + e.message;
    }
}

async function fetchByConfig() {
    var btn = event ? event.target : arguments.callee;
    btn.disabled = true;
    btn.textContent = '抓取中...';
    var resultEl = document.getElementById('kw-result');
    resultEl.textContent = '开始按设置抓取...';
    try {
        var params = new URLSearchParams();
        params.append('max_results', document.getElementById('kw-target-new').value || '{{ fetch_config.max_results }}');
        var mode = document.querySelector('input[name="config-fetch-mode"]:checked');
        params.append('mode', mode ? mode.value : 'incremental');
        var res = await fetch('/api/keyword-fetch', {method: 'POST', body: params});
        if (!res.ok) { resultEl.textContent = '请求失败'; btn.disabled = false; btn.textContent = '按设置抓取'; return; }
        resultEl.textContent = '等待结果...';
        waitFetchResult(function(data) {
            resultEl.textContent = '抓取完成: 获取 ' + (data.fetched || 0) + ' 篇, 新增 ' + (data.new || 0) + ' 篇';
            btn.disabled = false;
            btn.textContent = '按设置抓取';
        });
    } catch(e) {
        resultEl.textContent = '网络错误: ' + e.message;
        btn.disabled = false;
        btn.textContent = '按设置抓取';
    }
}
</script>
